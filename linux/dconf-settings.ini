# Hand-picked GNOME settings (gsettings/dconf). Applied by link_dotfiles.sh via `dconf load /`.
# Only the keys listed here are changed; everything else is left alone.
# Find a key's path: `dconf watch /` while changing it in the GUI, or `dconf dump /org/gnome/<x>/`.

[org/gnome/software]
allow-updates=false
download-updates=false

[org/gnome/settings-daemon/plugins/media-keys]
volume-step=1
screensaver=['<Shift><Control>Home']

[org/gnome/desktop/input-sources]
xkb-options=['shift:both_capslock_cancel', 'shift:both_capslock']
